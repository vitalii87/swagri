[workspace]
members = [
    "crates/swagri-core",
    "crates/swagri-executor",
    "crates/swagri-storage",
    "crates/swagri-node",
    "crates/swagri-debugger",
    "crates/swagri-updater",
]
resolver = "2"

[workspace.package]
version = "0.14.3"
edition = "2024"
rust-version = "1.95"
authors = ["Vitalii <vitalii87@users.noreply.github.com>"]
repository = "https://github.com/vitalii87/swagri"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.56", features = [
    "cbor",
    "identify",
    "macros",
    "mdns",
    "ping",
    "quic",
    "request-response",
    "serde",
    "tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_plot = "0.36"
sysinfo = "0.39"
rfd = "0.15"
semver = "1"
webbrowser = "1"
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
